[build]
  functions = "netlify/functions"
 
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
 

# Old sectional pages that were split into separate listings: send visitors and Google to the new page
[[redirects]]
  from = "/products/restore-modular-sectional"
  to = "/products/restore-l-shaped-sectional"
  status = 301
  force = true

[[redirects]]
  from = "/products/roscoe-sectional-sofa-with-chaise"
  to = "/products/roscoe-l-shaped-sectional-with-chaise"
  status = 301
  force = true

[[redirects]]
  from = "/products/solace-modular-sectional"
  to = "/products/solace-l-shaped-sectional"
  status = 301
  force = true

[[redirects]]
  from = "/products/keynote-upholstered-platform-bed"
  to = "/products/keynote-storage-platform-bed"
  status = 301
  force = true

# Category and room pages: /shop/sofas, /shop/bedroom-furniture, ... show the shop page,
# filled in for that category by netlify/edge-functions/category-seo.js
[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200

# Readable product URLs: /products/orson-nightstand shows the product page
[[redirects]]
  from = "/products/*"
  to = "/product-detail.html"
  status = 200

# Review-request emails: checks once a day (11am New York time) and sends day 3 / 7 / 14 reminders
[functions."review-reminders"]
  schedule = "0 15 * * *"

# Modway stock check: twice a day, 6:00am and 6:00pm New York time. Starts modway-stock-check-background.
# One run has time for about half of the Modway pages; each run picks up where the last one stopped,
# so every Modway option is checked at least once a day.
[functions."modway-stock-sync"]
  schedule = "0 11,23 * * *"

# HerNest stock check: every morning at 7:50am New York time (after the Modway sync).
# Starts hernest-stock-check-background, which checks every HerNest product page.
[functions."hernest-stock-sync"]
  schedule = "50 11 * * *"

# Crate & Barrel / CB2 stock check: no longer scheduled here. Their sites block server requests (HTTP 403),
# so the check now runs every morning at 8:17am through the owner's Chrome (a Claude scheduled task)
# and writes its results to Supplier Sync. cb-stock-sync / cb-stock-check-background are kept for manual use.

# Stock watchdog: every morning at 9:00am New York time. Emails you if any supplier's stock
# check hasn't finished in the last 2 days (Alpine: 2 weekdays, since its feed skips weekends).
[functions."stock-watchdog"]
  schedule = "0 14 * * *"
