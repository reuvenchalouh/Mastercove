[build]
  functions = "netlify/functions"
 
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
 

# Readable product URLs: /products/orson-nightstand shows the product page
[[redirects]]
  from = "/products/*"
  to = "/product-detail.html"
  status = 200

# Review-request emails: checks once a day (11am New York time) and sends day 3 / 7 / 14 reminders
[functions."review-reminders"]
  schedule = "0 15 * * *"

# Modway stock sync: checks every Modway product each morning (7am New York time)
# and marks finishes/fabrics/sizes in or out of stock automatically
[functions."modway-stock-sync"]
  schedule = "0 11 * * *"
