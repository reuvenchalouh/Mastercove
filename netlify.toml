[build]
  functions = "netlify/functions"
 
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
 

# Old sectional pages that were split into separate listings: send visitors and Google to the new page
[[redirects]]
  from = "/products/restore-modular-sectional"
  to = "/products/restore-l-shaped-sectional"
  status = 301
  force = true

[[redirects]]
  from = "/products/roscoe-sectional-sofa-with-chaise"
  to = "/products/roscoe-l-shaped-sectional-with-chaise"
  status = 301
  force = true

[[redirects]]
  from = "/products/solace-modular-sectional"
  to = "/products/solace-l-shaped-sectional"
  status = 301
  force = true

# Readable product URLs: /products/orson-nightstand shows the product page
[[redirects]]
  from = "/products/*"
  to = "/product-detail.html"
  status = 200

# Review-request emails: checks once a day (11am New York time) and sends day 3 / 7 / 14 reminders
[functions."review-reminders"]
  schedule = "0 15 * * *"

# Modway stock check: every morning at 7:00am New York time. Starts modway-stock-check-background,
# which checks every Modway variant in one run and marks finishes/fabrics/sizes in or out of stock.
[functions."modway-stock-sync"]
  schedule = "0 11 * * *"

# HerNest stock check: every morning at 7:50am New York time (after the Modway sync).
# Starts hernest-stock-check-background, which checks every HerNest product page.
[functions."hernest-stock-sync"]
  schedule = "50 11 * * *"
